version: '3'

tasks:
  build:frontend:
    cmds:
      - pnpm --dir tools/parity install --frozen-lockfile
      - pnpm --dir frontend install --frozen-lockfile
      - go mod download
      - task: notices
      - task: bindings
      - pnpm --dir frontend build
  bindings:
    cmds:
      - wails3 generate bindings -ts -clean=true
      - task: bindings:android
  bindings:android:
    cmds:
      - wails3 generate bindings -ts -clean=false ./internal/mobile
    env:
      GOOS: android
      GOARCH: arm64
      CGO_ENABLED: '0'
  notices:
    cmds:
      - node -e "require('fs').mkdirSync('.task/build', {recursive:true})"
      - pnpm --dir frontend list --prod --depth Infinity --json > .task/build/frontend-dependencies.json
      - pnpm --dir tools/parity list --prod --depth Infinity --json > .task/build/reference-dependencies.json
      - node build/notices.mjs .task/build/frontend-dependencies.json .task/build/reference-dependencies.json
