version: '3'

tasks:
  build:
    cmds:
      - task: :common:build:frontend
      - wails3 generate syso -arch {{.ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_{{.ARCH}}.syso
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .
      - powershell -NoProfile -Command "Remove-Item -LiteralPath 'wails_windows_{{.ARCH}}.syso'"
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: '0'
