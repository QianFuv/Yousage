name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  # Stage 3: build-acceptance after all caller quality gates succeed.
  context:
    name: Validate version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.context.outputs.build }}
      published: ${{ steps.context.outputs.published }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Verify version consistency
        id: verify_version_consistency
        run: node build/version.mjs check
      - name: Validate immutable release source
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/release-contract.mjs context
      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORM: independent
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  desktop:
    name: Build Windows portable package
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload_build_artifact.outputs.artifact-id }}
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Preserve LF line endings
        id: preserve_lf_line_endings
        run: git config --global core.autocrlf false
      - name: Check out source
        id: check_out_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Install Node.js
        id: install_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: |
            tools/parity/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install Go
        id: install_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install dependencies
        id: install_dependencies
        run: |
          pnpm --dir tools/parity install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wails = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails"
      - name: Desktop frontend
        id: desktop_frontend
        run: pnpm --dir frontend build
      - name: Executable
        id: executable
        run: |
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/yousage.exe .
      - name: Portable ZIP
        id: portable_zip
        run: ./build/package-windows.ps1
      - name: Record build-acceptance provenance
        id: record_build_acceptance_provenance
        run: |
          New-Item -ItemType Directory -Path .task/windows -Force | Out-Null
          Copy-Item -LiteralPath "artifacts/releases/yousage_${env:VERSION}_windows_amd64.zip" -Destination .task/windows
          node build/ci-artifacts.mjs manifest .task/windows windows/amd64
      - name: Upload build artifact
        id: upload_build_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release-${{ github.run_attempt }}
          path: .task/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORM: windows/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  android:
    name: Build Android APK
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.upload_build_artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        id: check_out_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Install Node.js
        id: install_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: |
            tools/parity/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install Go
        id: install_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install Java
        id: install_java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        id: install_dependencies
        run: |
          pnpm --dir tools/parity install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          GOTOOLCHAIN=local go mod download
          git diff --exit-code -- go.mod go.sum
      - name: Android frontend
        id: android_frontend
        run: pnpm --dir frontend build:android
      - name: Restore signing key
        id: restore_signing_key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
            [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets; releases are never signed with a debug key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/yousage-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Release APK
        id: release_apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: go run ./build/android/scripts -mode release -arch arm64
      - name: APK signature
        id: apk_signature
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          certificates="$("$apksigner" verify --print-certs artifacts/releases/yousage-release-arm64.apk)"
          echo "$certificates"
          if grep -q "CN=Android Debug" <<< "$certificates"; then
            echo "::error::The APK is signed with a debug key."
            exit 1
          fi
          mv artifacts/releases/yousage-release-arm64.apk "artifacts/releases/yousage_${VERSION}_android_arm64.apk"
      - name: Record build-acceptance provenance
        id: record_build_acceptance_provenance
        run: |
          mkdir -p .task/android
          cp "artifacts/releases/yousage_${VERSION}_android_arm64.apk" .task/android/
          node build/ci-artifacts.mjs manifest .task/android android/arm64
      - name: Upload build artifact
        id: upload_build_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release-${{ github.run_attempt }}
          path: .task/android/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORM: android/arm64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  relay:
    name: Build and test relay image
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload_build_artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        id: check_out_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Relay image
        id: relay_image
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          docker build --file build/relay/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag yousage-relay:ci .
      - name: Smoke test relay image
        id: smoke_test_relay_image
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          export YOUSAGE_RELAY_TOKEN="$token"
          trap 'docker logs yousage-relay-ci; docker rm --force --volumes yousage-relay-ci' EXIT
          docker run --detach --name yousage-relay-ci \
            --env YOUSAGE_RELAY_TOKEN \
            --publish 127.0.0.1:18080:8080 yousage-relay:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:18080/healthz
          python3 - <<'PY'
          """Verify the built relay HTTP surface with disposable synthetic data."""
          import json
          import os
          import re
          import secrets
          import urllib.error
          import urllib.request

          BASE_URL = "http://127.0.0.1:18080"
          TOKEN = os.environ["YOUSAGE_RELAY_TOKEN"]

          def request(path, method="GET", body=None, bearer=None):
              """Return a relay response, including expected HTTP errors.

              Args:
                  path: The relay endpoint path.
                  method: The HTTP method.
                  body: Optional request bytes.
                  bearer: Optional write token.

              Returns:
                  The HTTP status, headers and response bytes.
              """
              headers = {"Content-Type": "application/octet-stream"}
              if bearer is not None:
                  headers["Authorization"] = f"Bearer {bearer}"
              message = urllib.request.Request(
                  BASE_URL + path, data=body, headers=headers, method=method
              )
              try:
                  response = urllib.request.urlopen(message, timeout=10)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.headers, response.read()

          status, _, body = request("/healthz")
          assert status == 200 and json.loads(body) == {"status": "ok"}
          for bearer in (None, "incorrect-token"):
              status, headers, _ = request("/api/auth", bearer=bearer)
              assert status == 401
              assert headers["WWW-Authenticate"] == "Bearer"
              assert headers["Cache-Control"] == "no-store"
          assert request("/api/auth", bearer=TOKEN)[0] == 204
          for prefix in ("v", "s"):
              status, headers, body = request(f"/{prefix}/{'A' * 22}")
              assert status == 200
              assert "script-src 'self'" in headers["Content-Security-Policy"]
              assert headers["Referrer-Policy"] == "no-referrer"
              assert headers["X-Content-Type-Options"] == "nosniff"
              assets = re.findall(rb'(?:src|href)="(/assets/[^" ]+)"', body)
              assert assets, "Built frontend assets are missing"
              for asset in assets:
                  assert request(asset.decode())[0] == 200
          space_id = secrets.token_urlsafe(16)
          path = f"/api/spaces/{space_id}"
          envelope = b"\x01" + secrets.token_bytes(64)
          try:
              assert request(path, "PUT", envelope)[0] == 401
              assert request(path, "PUT", envelope, TOKEN)[0] == 204
              status, headers, body = request(path)
              assert status == 200 and body == envelope
              assert headers["Cache-Control"] == "no-store"
              assert headers["ETag"] and headers["Last-Modified"]
          finally:
              assert request(path, "DELETE", bearer=TOKEN)[0] == 204
          assert request(path)[0] == 404
          status, _, body = request(
              "/api/shares/reserve?ttlDays=1", "POST", bearer=TOKEN
          )
          assert status == 201
          path = f"/api/shares/{json.loads(body)['id']}"
          try:
              assert request(path)[0] == 404
              assert request(path, "PUT", envelope, TOKEN)[0] == 204
              assert request(path, "PUT", envelope, TOKEN)[0] == 409
              status, headers, body = request(path)
              assert status == 200 and body == envelope
              assert headers["Cache-Control"] == "no-store"
          finally:
              assert request(path, "DELETE", bearer=TOKEN)[0] == 204
          assert request(path)[0] == 404
          print("Relay image smoke checks passed")
          PY
      - name: Save relay image
        id: save_relay_image
        run: |
          mkdir -p .task/relay
          docker save yousage-relay:ci | gzip > .task/relay/relay-image.tar.gz
      - name: Record build-acceptance provenance
        id: record_build_acceptance_provenance
        run: node build/ci-artifacts.mjs manifest .task/relay linux/amd64
      - name: Upload build artifact
        id: upload_build_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relay-release-${{ github.run_attempt }}
          path: .task/relay/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORM: linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  # Stage 4: publish only the fully accepted, same-source platform bytes.
  publish:
    name: Publish release
    needs: [context, desktop, android, relay]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Download tested Windows archive
        id: download_tested_windows_archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.desktop.outputs.artifact_id }}
          path: .task/release/windows
          merge-multiple: true
      - name: Download signed Android package
        id: download_signed_android_package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          path: .task/release/android
          merge-multiple: true
      - name: Download tested Relay image
        id: download_tested_relay_image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.relay.outputs.artifact_id }}
          path: .task/release/relay
          merge-multiple: true
      - name: Assemble and validate release assets
        id: assemble_and_validate_release_assets
        run: node build/release-contract.mjs assets
      - name: Verify tested Relay image identity
        id: verify_tested_relay_image_identity
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gunzip --stdout .task/release/relay/relay-image.tar.gz | docker load
          test "$(docker image inspect yousage-relay:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$COMMIT"
          test "$(docker image inspect yousage-relay:ci --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          test "$(docker image inspect yousage-relay:ci --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          echo "RELAY_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yousage-relay:$VERSION" >> "$GITHUB_ENV"
      - name: Protect immutable Relay version image
        id: registry
        run: node build/release-image.mjs
      - name: Prepare categorized notes and immutable draft assets
        id: prepare_categorized_notes_and_immutable_draft_assets
        run: node build/release-contract.mjs prepare
      - name: Publish tested Relay version image
        id: publish_tested_relay_version_image
        if: steps.registry.outputs.push == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag yousage-relay:ci "$RELAY_IMAGE"
          docker push "$RELAY_IMAGE"
      - name: Publish binary release
        id: publish
        run: node build/release-contract.mjs publish
      - name: Upload publication evidence
        id: upload_publication_evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-publication-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .task/release/notes.md
            .task/release/assets/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
      - name: Report publish summary
        id: report_publish_summary
        if: always()
        env:
          CI_STAGE: publish
          CI_PLATFORM: windows/amd64,android/arm64,linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  promote:
    name: Update latest pointers
    needs: [context, publish]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      (needs.publish.result == 'success' || needs.context.outputs.published == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Protect newest stable version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/release-contract.mjs latest
      - name: Promote tested release image
        if: steps.latest.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yousage-relay"
          docker pull "$image:$VERSION"
          test "$(docker image inspect "$image:$VERSION" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$COMMIT"
          docker tag "$image:$VERSION" "$image:latest"
          docker push "$image:latest"
      - name: Report publish summary
        if: always()
        env:
          CI_STAGE: publish
          CI_PLATFORM: linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  complete:
    name: Confirm complete release
    needs: [context, desktop, android, relay, publish, promote]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Require complete build acceptance and publication
        id: require_complete_build_acceptance_and_publication
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
          import assert from "node:assert/strict";
          const results = JSON.parse(process.env.RESULTS);
          assert.equal(results.context.result, "success");
          assert.equal(results.promote.result, "success");
          if (results.context.outputs.published !== "true")
            for (const name of ["desktop", "android", "relay", "publish"])
              assert.equal(results[name].result, "success", `${name} must succeed`);
          '
      - name: Verify public release and exact asset membership
        id: verify_public_release_and_exact_asset_membership
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/release-contract.mjs verify
      - name: Report publish summary
        id: report_publish_summary
        if: always()
        env:
          CI_STAGE: publish
          CI_PLATFORM: independent
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs
