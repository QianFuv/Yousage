name: Reusable Frontend Checks

on:
  workflow_call:
    outputs:
      artifact_id:
        description: Immutable same-run tested frontend artifact
        value: ${{ jobs.frontend.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks and builds
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Preserve LF line endings
        id: preserve_lf_line_endings
        run: git config --global core.autocrlf false
      - name: Check out source
        id: check_out_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        id: install_pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - name: Install Node.js
        id: install_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: |
            tools/parity/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install dependencies
        id: install_dependencies
        run: |
          pnpm --dir tools/parity install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
      - name: Reference sources and tests
        id: reference_sources_and_tests
        run: pnpm --dir tools/parity test
      - name: Check frontend types
        id: check_frontend_types
        run: pnpm --dir frontend typecheck
      - name: Lint frontend
        id: lint_frontend
        run: pnpm --dir frontend lint
      - name: Check frontend formatting
        id: check_frontend_formatting
        run: pnpm --dir frontend format:check
      - name: Test frontend
        id: test_frontend
        run: pnpm --dir frontend test
      - name: Desktop frontend
        id: desktop_frontend
        run: pnpm --dir frontend build
      - name: Relay frontend
        id: relay_frontend
        run: pnpm --dir frontend build:web
      - name: Record tested frontend provenance
        id: record_tested_frontend_provenance
        run: node build/ci-artifacts.mjs stage-frontend .task/quality
      - name: Upload tested frontend bytes
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-quality-${{ github.run_attempt }}
          path: .task/quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Report quality summary
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORM: frontend
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs
