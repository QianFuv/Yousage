name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Retry the checked-in version on main (leave empty for quality only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Stage 1: detect-changes.
  release-rules:
    name: Release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - name: Verify version consistency
        id: verify_version_consistency
        run: node build/version.mjs check
      - name: Verify release and workflow contracts
        id: verify_release_and_workflow_contracts
        run: node --test build/release-notes.test.mjs build/release-contract.test.mjs build/ci-artifacts.test.mjs build/ci-workflows.test.mjs
      - name: Resolve version increase or explicit retry
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node build/release-contract.mjs detect
      - name: Report detect-changes summary
        id: report_detect_changes_summary
        if: always()
        env:
          CI_STAGE: detect-changes
          CI_PLATFORM: independent
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node build/ci-report.mjs

  # Stage 2: quality. Release candidates cannot be cancelled by later pushes.
  frontend:
    name: Frontend
    needs: release-rules
    concurrency:
      group: frontend-${{ needs.release-rules.outputs.release == 'true' && format('release-{0}', github.run_id) || format('quality-{0}', github.ref) }}
      cancel-in-progress: true
    uses: ./.github/workflows/frontend.yml

  backend:
    name: Backend
    needs: [release-rules, frontend]
    concurrency:
      group: backend-${{ needs.release-rules.outputs.release == 'true' && format('release-{0}', github.run_id) || format('quality-{0}', github.ref) }}
      cancel-in-progress: true
    uses: ./.github/workflows/backend.yml
    with:
      frontend_artifact_id: ${{ needs.frontend.outputs.artifact_id }}

  # Stages 3 and 4: build-acceptance, then publish inside the reusable workflow.
  release:
    name: Version release
    needs: [release-rules, frontend, backend]
    if: needs.release-rules.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-rules.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
