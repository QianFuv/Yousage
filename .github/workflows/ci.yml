name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify desktop and frontend
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check version consistency
        run: node build/version.mjs check
      - name: Test categorized release notes
        run: node --test build/release-notes.test.mjs
      - name: Verify portable package layout and upgrades
        run: ./build/test-package-windows.ps1
      - name: Install dependencies
        run: |
          npm install --global pnpm@10.32.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir tools/parity install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile
      - name: Verify reference sources and tests
        run: pnpm --dir tools/parity test
      - name: Check frontend types
        run: pnpm --dir frontend typecheck
      - name: Lint frontend
        run: pnpm --dir frontend lint
      - name: Check frontend formatting
        run: pnpm --dir frontend format:check
      - name: Test frontend
        run: pnpm --dir frontend test
      - name: Build desktop frontend
        run: pnpm --dir frontend build
      - name: Build relay frontend
        run: pnpm --dir frontend build:web
      - name: Check Go formatting
        run: |
          $unformatted = gofmt -l .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted) {
            $unformatted
            exit 1
          }
      - name: Test Go packages
        run: go test -count=1 -p 1 -timeout=10m ./...
      - name: Vet Go packages
        run: go vet ./...

  relay:
    name: Test relay on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test Linux relay packages
        run: go test -count=1 -timeout=5m ./internal/relay ./cmd/yousage-relay ./internal/sync
